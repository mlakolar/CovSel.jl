name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
        include:
          - version: '1'
            os: macos-latest
            arch: aarch64
          - version: '1'
            os: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # ProximalBase 0.5 and ProximalOPT 0.2 are not registered yet (ProximalBase
      # PR #23, ProximalOPT PR #11). Julia 1.11 and later take them from
      # [sources] in Project.toml; Julia 1.10 ignores [sources], and resolves
      # each Pkg.add with the whole project, so both are added in one call.
      # Remove this step and [sources] once both are registered.
      - name: Add ProximalBase 0.5 and ProximalOPT 0.2 from GitHub on Julia 1.10
        if: matrix.version == 'lts'
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.add([PackageSpec(url="https://github.com/mlakolar/ProximalBase.jl", rev="proximalbase-0.5"),
                   PackageSpec(url="https://github.com/mlakolar/ProximalOPT.jl", rev="generic-solvers")])
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  examples:
    name: Examples and benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Run the examples with small settings
        env:
          COVSEL_EXAMPLES_QUICK: '1'
        run: |
          julia --project=examples -e 'using Pkg; Pkg.instantiate()'
          for f in examples/*.jl; do
            echo "::group::$f"
            julia --project=examples "$f"
            echo "::endgroup::"
          done
      - name: Run the benchmarks with small settings
        env:
          COVSEL_BENCHMARK_QUICK: '1'
        run: |
          julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
          julia --project=benchmark benchmark/run.jl
